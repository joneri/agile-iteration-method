name: AIM Release Readiness

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python3 -m compileall -q scripts tests

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Audit documentation and website
        run: python3 scripts/audit_documentation.py .

      - name: Validate AIM product coherence
        run: python3 scripts/validate_aim_runtime.py . --release

      - name: Build and validate release-facing artifact
        run: python3 scripts/validate_publication.py --output site

      - name: Revalidate assembled artifact
        run: python3 scripts/validate_publication.py --output site --check-only

      - name: Upload validated release-facing artifact
        uses: actions/upload-artifact@v4
        with:
          name: aim-release-facing-artifact
          path: site
          if-no-files-found: error
          include-hidden-files: true

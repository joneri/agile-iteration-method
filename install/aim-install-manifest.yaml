aimInstallManifest:
  manifestVersion: "0.3"
  status: guided-first

  canonicalCommand: "python3 scripts/aim_install.py"

  modes:
    - team
    - personal
    - enterprise

  adapters:
    - copilot
    - codex
    - claude

  footprints:
    - local
    - profile
    - adapters
    - full

  gitignoreFragments:
    - .aim/

  modeProfiles:
    team:
      defaultFootprint: adapters
      includeOptionalSurfaces: true
      gitignore:
        - .aim/
    personal:
      defaultFootprint: adapters
      includeOptionalSurfaces: true
      gitignore:
        - .aim/
    enterprise:
      defaultFootprint: local
      includeOptionalSurfaces: false
      enterpriseSafe: true
      gitignore:
        - /.aim
        - /.aim-local
        - /aim.local.*
        - /*.aim.local.md
        - /*.aim.process.md

  footprintProfiles:
    local:
      description: Local packages only; no target-repository mutation.
      embeddedDocs: false
      repoAdapters: false
      sharedProfile: false
      repoIgnore: false
      homeAdapters: true
    profile:
      description: Tiny shared profile and runtime ignore policy; no repo adapters or docs.
      embeddedDocs: false
      repoAdapters: false
      sharedProfile: true
      repoIgnore: true
      homeAdapters: true
    adapters:
      description: Selected adapter packages; Team also gets the shared profile.
      embeddedDocs: false
      repoAdapters: true
      sharedProfile: team-default
      repoIgnore: true
      homeAdapters: true
    full:
      description: Shared profile, selected adapters, and embedded workflow docs.
      embeddedDocs: true
      repoAdapters: true
      sharedProfile: true
      repoIgnore: true
      homeAdapters: true

  targetExclusions:
    - path: CONTRIBUTING.md
      reason: AIM-source-repository-maintainer-only
      operations:
        copy: forbidden
        create: forbidden
        modify: forbidden
        require: forbidden
        read: forbidden

  packageBoundaries:
    canonicalDocs:
      source: docs/workflow/
      targetOwned: true
    schemas:
      source: schemas/
      destination: schemas/
      includedWith: embeddedDocs
      targetOwned: true
    codex:
      source: adapters/codex/agile-iteration-method/
      destination: ~/.codex/skills/agile-iteration-method/
      optional: true
    copilotAgents:
      source: .github/agents/aim*.agent.md
      destination: .github/agents/
      optional: true
    copilotPrompts:
      source: .github/prompts/
      destination: .github/prompts/
      optional: true
    claude:
      source: .claude/
      destination: .claude/
      optional: true

  repoAwarenessBootstrap:
    sharedProfile: aim.profile.yaml
    personalHints: ~/.aim/repo-awareness/<repo-fingerprint>/hints.yaml
    initialStatus:
      - needs_calibration
      - partially_ready
    readyRequiresCalibration: true
    calibrationCommand: /aim calibrate-repo
    runtimeProfileStorage: forbidden

  runtimeExclusions:
    - .aim/
